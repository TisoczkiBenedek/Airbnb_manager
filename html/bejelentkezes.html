<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="../css/bejelentkezes.css">
    <title>Bejelentkezés</title>
</head>
<body>
    <header class="mt-5" id="infok">
        <p>Üdvözöljük az Airbnb Manager oldalán</p>
        <p>Kérem töltse ki az alábbi mezőket a bejelentkezéshez!</p>
    </header>
    <div class="row justify-content-center">
    <div class="justify-content-center mt-3 mb-5 col-lg-4 col-sm-10 mx-sm-2 col-md-6" id="urlap">
        <form>
            <label for="email" class="form-label">E-mail cím</label>
            <input type="email" class="form-control" id="email">
            <label for="jelszo" class="form-label">Jelszó</label>
            <input type="password" class="form-control" id="jelszo" >
            <h6 class="mx-2 text-danger text-center" hidden id="vhely">

            </h6>
            <button type="button" id="gomb" class="btn btn-info mt-3 d-grid mx-auto">Bejelentkezés</button>
        </form>
        
    </div>
</div>
    <script src="../js/bejelentkezes.js"></script>
</body>
</html>
