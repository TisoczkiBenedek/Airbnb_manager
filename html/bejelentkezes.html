<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="../css/bejelentkezes.css">
    <title>Bejelentkezés</title>
</head>

<body>
    <header class="mt-5" id="infok">
        <p>Üdvözöljük az Airbnb Manager oldalán</p>
        <p>Kérem töltse ki az alábbi mezőket a bejelentkezéshez!</p>
    </header>
    <div class="row justify-content-center">
        <div class="justify-content-center mt-3 mb-5 col-lg-4 col-sm-10 mx-sm-2 col-md-6" id="urlap">
            <form>

                <label for="email" class="form-label">E-mail cím</label>
                <input type="email" class="form-control" id="email">
                <label for="jelszo" class="form-label">Jelszó</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="jelszo">
                    <span class="input-group-text" id="szem"><svg  xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                      </svg></span>
                </div>
                <h6 class="mx-2 text-danger text-center" hidden id="vhely">

                </h6>
                <button type="button" id="gomb" class="btn btn-info mt-3 d-grid mx-auto">Bejelentkezés</button>
            </form>

        </div>
    </div>
    <script src="../js/bejelentkezes.js"></script>
</body>

</html>
