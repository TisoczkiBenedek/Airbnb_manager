<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/regisztracio.css">
</head>
<body id="torzs">
    <header class="mt-5 mb-5" id="infok">
        <p>Üdvözöljük az Airbnb Manager oldalán</p>
        <p>Kérem töltse ki az alábbi űrlapot a regisztrációhoz!</p>
    </header>
    <div class="d-flex justify-content-center mt-5 mb-5" id="urlap">
        <form>
            <label for="email" class="form-label">E-mail cím</label>
            <input type="email" class="form-control" id="email">
            <label for="jelszo" class="form-label">Jelszó</label>
            <div class="input-group">
                <input type="password" class="form-control" id="jelszo">
                <span class="input-group-text" id="szem"><svg  xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                    <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                  </svg></span>
            </div>
            <label for="vnev" class="form-label">Vezetéknév</label>
            <input type="text" class="form-control" id="vnev">
            <label for="knev" class="form-label">Keresztnév</label>
            <input type="text" class="form-control" id="knev" >
            <label for="telefonszam" class="form-label">Telefonszám</label>
            <input type="tel" class="form-control" id="telefonszam" >
            <label for="megye" class="form-label">Megye</label>
            <select id="megye" class="form-select" value="">
                <option value=""></option>
            </select>
            <label for="megye" class="form-label mt-2">Profil típusának kiválasztása</label>
            <div id="fontos">
                <label for="takarito" class="form-label">Takarító</label>
                <input type="radio" class="form-check-input" name="valasztas" id="takarito">
                <label for="tulaj" class="form-label">Lakástulajdonos</label>
                <input type="radio" class="form-check-input" name="valasztas" id="tulaj">
            </div>
            <button type="button" id="gomb" class="btn btn-info mt-3 d-grid mx-auto">Regisztráció</button>
        </form>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="vhely">
        <div class="toast" role="alert" aria-live="assertive" aria-atomic="true" id="toast">
            <div class="toast-header">
                <strong class="me-auto" id="visszajelz"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="tbody">

            </div>
        </div>
    </div>
    
    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/regisztracio.js"></script>
</body>
</html>
