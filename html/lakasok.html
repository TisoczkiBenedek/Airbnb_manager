<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/lakastulaj.css">
    <title>Lakások</title>
</head>
<body>
  <div class="pos-f-t">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <button type="button" class="btn btn-secondary" style="right: 5%;" onclick="kijelentkezes()">Kijelentkezés</button>
        <h2 id="cim" class="text-white mb-0 mx-3">Főoldal</h2>
        <div class="navbar-right" id="profilAdatok">
          <span class="text-white" id="profilNev" style="margin-right: 10px;"></span>
          <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16" style="color: white;">
            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
          </svg>
        </div>
      </div>
    </nav>
  </div>

  <div class="container">
    <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#modal_ujLakas">Új lakás hozzáadása</button>
    <hr class="mt-2">
    <div class="row" id="valasz"></div> <!-- Lakások megjelenítése itt történik -->
  </div>

  <!-- Módosított új lakás modal -->
  <div class="modal fade" id="modal_ujLakas" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5">Új Lakás Feltöltése</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="lakasForm" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">Lakás neve</label>
              <input type="text" class="form-control" name="lakasNev" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Cím</label>
              <input type="text" class="form-control" name="lakcim" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Terület (m²)</label>
              <input type="number" class="form-control" name="terulet" required>
            </div>

            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="medence" id="medence">
                <label class="form-check-label">Medence</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="szauna" id="szauna">
                <label class="form-check-label">Szauna</label>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Megye</label>
              <select class="form-select" name="megye" required>
                <option value="">Válasszon megyét</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Leírás</label>
              <textarea class="form-control" name="lakasAdatok" rows="3" required></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Képek feltöltése</label>
              <input type="file" class="form-control" name="kepFeltoltes[]" accept="image/*" multiple>
            </div>

            <div class="mb-3">
              <label class="form-label">Naptár fájl (ICS)</label>
              <input type="file" class="form-control" name="naptarFeltoltes" accept=".ics">
            </div>

            <button type="submit" class="btn btn-primary w-100">Feltöltés</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal elem módosítás -->
  <div class="modal fade" id="modal_modosit" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5">Lakás módosítása</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="modositForm" enctype="multipart/form-data">
                    <input type="hidden" name="id" id="lakasId">
                    
                    <div class="mb-3">
                        <label class="form-label">Lakás neve</label>
                        <input type="text" class="form-control" name="nev" id="lakasNev" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Cím</label>
                        <input type="text" class="form-control" name="cim" id="lakcim" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Terület (m²)</label>
                        <input type="number" class="form-control" name="terulet" id="terulet" required>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="medence" id="medence">
                            <label class="form-check-label">Medence</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="szauna" id="szauna">
                            <label class="form-check-label">Szauna</label>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Megye</label>
                        <select class="form-select" name="megye" id="megye" required></select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Leírás</label>
                        <textarea class="form-control" name="belepesi_adatok" id="lakasAdatok" required></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Új kép feltöltése</label>
                        <input type="file" class="form-control" name="kepFeltoltes" accept="image/*">
                    </div>

                    <div class="mb-3">
                      <label for="naptarFeltoltes" class="form-label">Naptár frissítése (Airbnb iCal kiterjesztésű fájl)</label>
                      <input type="file" class="form-control" name="naptarFeltoltes" id="naptarFeltoltes" accept=".ics" ><br />
                    </div>
                    <button type="submit" class="btn btn-primary">Mentés</button>
                </form>
            </div>
        </div>
    </div>
  </div>

  <!--kép Modal -->
  <div id="kepModal" class="kep-modal">
    <span class="close" onclick="modalBezaras()">&times;</span>
    <img class="modal-content" id="modalKep">
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">Értesítés</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="toast-body">
            <!-- Ide kerül a hiba vagy siker üzenet -->
        </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/lakastulaj.js"></script>
  <script src="../js/ujLakas.js"></script>
  <script src="../js/lakasTorles.js"></script>
  <script src="../js/lakasModositas.js"></script>
</body>
</html>
