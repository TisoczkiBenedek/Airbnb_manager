<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Új Lakás Feltöltése</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/proba.css">
</head>
<body>
    <header class="mt-5 mb-5">
        <p>Kérem töltse ki az alábbi űrlapot az új lakás feltöltéséhez!</p>
    </header>
    <div class="d-flex justify-content-center mt-5 mb-5">
        <form id="lakasForm">
            <label for="lakasNev" class="form-label">A lakás neve</label>
            <input type="text" class="form-control" name="lakasNev" id="lakasNev" required><br />

            <label for="lakcim" class="form-label">Lakcím</label>
            <input type="text" class="form-control" name="lakcim" id="lakcim" required><br />

            <label for="terulet" class="form-label">A lakás területe (m²)</label>
            <input type="number" class="form-control" name="terulet" id="terulet" required><br />

            <label for="medence" class="form-label">Medence</label>
            <input type="checkbox" class="form-check-input" name="medence" id="medence"><br />

            <label for="szauna" class="form-label">Szauna</label>
            <input type="checkbox" class="form-check-input" name="szauna" id="szauna"><br />

            <label for="megye" class="form-label">Megye</label>
            <select id="megye" class="form-select" name="megye" required>
                <option value="">Válasszon megyét</option>
            </select><br />

            <label for="lakasAdatok" class="form-label">Lakás leírása</label>
            <textarea class="form-control" name="lakasAdatok" id="lakasAdatok" required></textarea><br />

            <label for="kepFeltoltes" class="form-label">Lakás képe</label>
            <input type="file" class="form-control" name="kepFeltoltes" id="kepFeltoltes" accept=".jpg, .png" required><br />

            <label for="naptarFeltoltes" class="form-label">Airbnb iCal fájl</label>
            <input type="file" class="form-control" name="naptarFeltoltes" id="naptarFeltoltes" accept=".ics" required><br />

            <button type="submit" class="btn btn-info mt-3">Feltöltés</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/ujLakas.js"></script>
</body>
</html>
