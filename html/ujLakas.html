<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/lakastulaj.css">
  <title>Lakások</title>
  <style>
    #cim {
      white-space: nowrap;
    }

    .navbar-collapse {
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="pos-f-t">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <!-- Hamburger Icon -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Title -->
        <h2 id="cim" class="text-white mb-0 mx-3">Főoldal</h2>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="#">Lakás hozzáadása</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Lakás módosítása</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Lakás törlése</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../html/lakasok.html">Lakások</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-qD1CfjC3BMGYr5w51zvHwsCcn20P4lL1FzDBANvvm6wrZT7fIQWutpV67TddIJ1N" crossorigin="anonymous"></script>

  <!-- Custom Script -->
  <script>
    function checkNavbarOverlap() {
      const title = document.getElementById("cim");
      const navbar = document.querySelector(".navbar-nav");

      // Get bounding boxes of the title and navbar
      const titleRect = title.getBoundingClientRect();
      const navbarRect = navbar.getBoundingClientRect();

      // Calculate distance between title and navbar
      const distance = navbarRect.left - titleRect.right;

      // Collapse navbar if the distance is less than or equal to 10px
      const navbarCollapse = document.getElementById("navbarNav");
      if (distance <= 10) {
        navbarCollapse.classList.add("collapse");
      } else {
        navbarCollapse.classList.remove("collapse");
      }
    }

    // Attach resize and DOMContentLoaded events
    window.addEventListener("resize", checkNavbarOverlap);
    document.addEventListener("DOMContentLoaded", checkNavbarOverlap);
  </script>
</body>
</html>
