<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naptár</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.4.0/fullcalendar.css" />
    <link rel="stylesheet" href="../css/naptar.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <button type="button" class="btn btn-secondary" style="right: 5%;" onclick="vissza()">Vissza</button>
      <h2 id="cim" class="text-white mb-0 mx-3">Naptár</h2>
      <div class="navbar-right" id="profilAdatok">
        <span class="text-white" id="profilNev" style="margin-right: 10px;"></span>
        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16" style="color: white;">
          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
          <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
        </svg>
      </div>
    </div>
  </nav>

  <div class="container" style="margin-top: 80px;">
    <div id='calendar'></div>
  </div>

  <!--Takarítás rendelés modal-->
  <div id="ujEsemenyModal" class="modal">
    <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2>Takarítás rendelése</h2>
        <form id="ujEsemenyForm">
            <div class="form-group">
                <label for="start">Takarítás kezdete:</label>
                <input type="time" id="start" name="start" class="form-control">
            </div>
            <div class="form-group">
                <label for="end">Takarítás befejezése:</label>
                <input type="time" id="end" name="end" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary mb-5" style="margin-top: 50px;">Takarítás megrendelése</button>
        </form>
    </div>
  </div>

  <!-- Toast értesítés -->
  <div id="toast" class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" style="position: fixed; top: 20px; right: 20px;">
    <div class="d-flex">
      <div class="toast-body">
        <!-- Az üzenet jelenik meg itt -->
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
  <script src="../js/naptar.js"></script>
</body>
</html>
